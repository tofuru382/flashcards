<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>フラッシュカード｜教科をえらぶ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.subjects{display:grid;gap:14px;margin-top:22px}
.subj{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px;position:relative;overflow:hidden}
.subj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.subj .lab{font-size:12px;color:var(--sub);letter-spacing:.06em}
.subj .t{font-family:"Zen Old Mincho",serif;font-size:24px;font-weight:700;margin:2px 0 4px}
.subj .d{font-size:13px;color:var(--sub);margin-bottom:12px}
.subj .row{display:flex;align-items:center;gap:10px}
.subj .bar{flex:1}
.subj .cnt{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.subj .go{position:absolute;right:16px;top:18px;font-size:20px;color:var(--sub)}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <p>ノートとプリントから作った暗記カード</p>
    <h1>教科を<em>えらぶ</em></h1>
  </header>
  <div class="subjects" id="subjects"></div>
  <p class="note">学習記録は教科ごとに、この端末のブラウザのクッキーに保存されます。</p>
</main>

<script src="data/kenpo.js"></script>
<script src="data/edo.js"></script>
<script>
"use strict";
const ORDER = ["kenpo", "edo"];
const DESC = {
  kenpo: "大日本帝国憲法／日本国憲法の制定・基本原理／前文の穴埋め",
  edo: "幕府の開設〜天保の改革（プリント第16〜21回）",
};
function getCookie(name) {
  const m = document.cookie.split("; ").find(c => c.startsWith(name + "="));
  return m ? m.slice(name.length + 1) : null;
}
function knownMap(key) {
  let s = "", i = 0, v;
  while ((v = getCookie(key + "_p" + i)) !== null) { s += v; i++; }
  if (!s) { try { s = localStorage.getItem(key + "_progress") || ""; } catch (e) {} }
  const m = {};
  for (const part of s.split(".")) { const [id, st] = part.split("-"); if (id) m[id] = +st || 0; }
  return m;
}
const box = document.getElementById("subjects");
for (const key of ORDER) {
  const S = window.SUBJECTS[key]; if (!S) continue;
  const m = knownMap(key);
  let k = 0, mid = 0;
  for (const c of S.cards) { if (m[c.id] === 2) k++; else if (m[c.id] === 1) mid++; }
  const n = S.cards.length;
  const a = document.createElement("a");
  a.className = "subj"; a.href = key + "/";
  a.innerHTML = `<div class="lab">${S.name}</div><div class="t">${S.short}</div>
    <div class="d">${DESC[key] || ""}・${n}枚</div>
    <div class="row"><div class="bar"><span class="k" style="width:${k / n * 100}%"></span><span class="m" style="width:${mid / n * 100}%"></span></div>
    <div class="cnt">${k}/${n} 覚えた</div></div><span class="go">›</span>`;
  box.appendChild(a);
}
</script>
</body>
</html>
